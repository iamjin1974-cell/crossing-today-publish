name: 크로싱투데이 자동 게시

# GitHub 예약 실행은 1.5~4시간씩 늦게 도는 일이 잦다 (34호 스레드가 새벽 1:23에 나감).
# 그래서 슬롯을 여러 개 두고, publish.py 가 POST_WINDOW_KST 창 안에 들어온 첫 실행만 게시한다 (이미 URL 있으면 건너뜀).
on:
  schedule:
    # 인스타 — 목표 06:40 KST, 창 06:30~09:30. 슬롯 21:40/22:10/22:40/23:10 UTC
    - cron: "40 21 * * *"
    - cron: "10 22 * * *"
    - cron: "40 22 * * *"
    - cron: "10 23 * * *"
    # 스레드 — 목표 21:00 KST, 창 20:30~23:50. 슬롯 10:35/11:05/11:35/12:05/12:35 UTC (19:35~21:35 KST 예약)
    - cron: "35 10 * * *"
    - cron: "5 11 * * *"
    - cron: "35 11 * * *"
    - cron: "5 12 * * *"
    - cron: "35 12 * * *"
    # 성과 수집 — 23:10 KST (늦어도 상관없음)
    - cron: "10 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "ig | threads | all | insights"
        default: "all"
      dry_run:
        description: "true면 실제 게시 없이 로그만"
        default: "false"

concurrency:
  group: publish
  cancel-in-progress: false

env:
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
  TH_USER_ID: ${{ secrets.TH_USER_ID }}
  TH_ACCESS_TOKEN: ${{ secrets.TH_ACCESS_TOKEN }}
  CLD_CLOUD_NAME: ${{ secrets.CLD_CLOUD_NAME }}
  CLD_API_KEY: ${{ secrets.CLD_API_KEY }}
  CLD_API_SECRET: ${{ secrets.CLD_API_SECRET }}
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
  POST_REELS: ${{ vars.POST_REELS || 'true' }}
  MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '1' }}
  THREADS_MEDIA: ${{ vars.THREADS_MEDIA || 'cover' }}
  THREADS_TOPIC_TAG: ${{ vars.THREADS_TOPIC_TAG || '독서' }}
  HASHTAG_REWRITE: ${{ vars.HASHTAG_REWRITE || 'true' }}
  HASHTAG_SET: "${{ vars.HASHTAG_SET || '#공감글귀 #글스타그램 #감성글 #좋은글귀 #옛글' }}"
  MUSIC_ENABLED: ${{ vars.MUSIC_ENABLED || 'true' }}
  MUSIC_DEFAULT_QUERY: ${{ vars.MUSIC_DEFAULT_QUERY || '' }}
  MUSIC_AUDIO_VOLUME: ${{ vars.MUSIC_AUDIO_VOLUME || '100' }}
  MUSIC_VIDEO_VOLUME: ${{ vars.MUSIC_VIDEO_VOLUME || '0' }}
  MUSIC_REQUIRED: ${{ vars.MUSIC_REQUIRED || 'false' }}
  REPLIES_PARENT_PAGE_ID: ${{ vars.REPLIES_PARENT_PAGE_ID || '3cf9dc9db84881de9cf1c93193db2a02' }}
  INSIGHTS_DAYS: ${{ vars.INSIGHTS_DAYS || '45' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: 인스타 게시 (아침)
        if: contains(fromJSON('["40 21 * * *","10 22 * * *","40 22 * * *","10 23 * * *"]'), github.event.schedule) || github.event.inputs.mode == 'ig' || github.event.inputs.mode == 'all'
        env:
          CHANNELS: ig,reels
          POST_WINDOW_KST: ${{ github.event_name == 'schedule' && '06:30-09:30' || '' }}
        run: python publish.py

      - name: 스레드 게시 (밤)
        if: contains(fromJSON('["35 10 * * *","5 11 * * *","35 11 * * *","5 12 * * *","35 12 * * *"]'), github.event.schedule) || github.event.inputs.mode == 'threads' || github.event.inputs.mode == 'all'
        env:
          CHANNELS: threads
          MAX_POSTS_PER_RUN: "3"
          POST_WINDOW_KST: ${{ github.event_name == 'schedule' && '20:30-23:50' || '' }}
        run: python publish.py

      - name: 성과 수집
        if: github.event.schedule == '10 14 * * *' || github.event.inputs.mode == 'insights'
        run: python insights.py
