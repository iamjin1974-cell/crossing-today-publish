name: 토큰 갱신 (매주)

on:
  schedule:
    - cron: "30 1 * * 1"   # 매주 월요일 10:30 KST
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pynacl
      - env:
          GH_PAT: ${{ secrets.GH_PAT }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TH_ACCESS_TOKEN: ${{ secrets.TH_ACCESS_TOKEN }}
        run: python refresh_tokens.py

      - name: 실패 시 레지스트리 '이상' 기록
        # 어느 단계에서 실패해도(GH_PAT·Meta 갱신·설치) 노션 레지스트리 '현재 상태' 칸의 '이상'에 "토큰 갱신 실패 <날짜>"를 넣는다
        if: failure()
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: pip install requests && python registry.py token-fail
